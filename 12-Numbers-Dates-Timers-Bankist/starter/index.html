<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRS Freelancer Cashflow Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: sans-serif;
      }
      body {
        background: #f1f5f9;
        padding: 24px;
        color: #1e293b;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .app {
        opacity: 0;
        transition: opacity 0.5s;
        max-width: 900px;
        margin: auto;
      }
      .balance-box {
        display: flex;
        justify-content: space-between;
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .movements {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
        max-height: 300px;
        overflow-y: auto;
      }
      .movements__row {
        display: flex;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid #e2e8f0;
      }
      .movements__type {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        color: white;
        margin-right: 16px;
      }
      .movements__type--deposit {
        background: #16a34a;
      }
      .movements__type--withdrawal {
        background: #dc2626;
      }
      .movements__date {
        font-size: 13px;
        color: #64748b;
      }
      .movements__value {
        margin-left: auto;
        font-weight: bold;
      }
      .summary {
        display: flex;
        gap: 20px;
        background: white;
        padding: 16px 20px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .operations {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .operation-card {
        background: white;
        padding: 16px;
        border-radius: 8px;
      }
      .btn-sort {
        cursor: pointer;
        padding: 8px 16px;
        background: #e2e8f0;
        border: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .timer-box {
        text-align: right;
        margin-top: 16px;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <!-- NAVIGATION / LOGIN -->
    <nav class="nav">
      <p class="welcome">Silakan Masuk ke Dasbor PT. CRS</p>
      <form class="login">
        <input
          type="text"
          placeholder="Username (cth: rp)"
          class="login__input login__input--user"
        />
        <input
          type="password"
          placeholder="PIN"
          maxlength="4"
          class="login__input login__input--pin"
        />
        <button class="login__btn">&rarr;</button>
      </form>
    </nav>

    <!-- MAIN APP CONTAINER -->
    <main class="app">
      <div class="balance-box">
        <div>
          <h2>Saldo Berjalan</h2>
          <p class="balance__date">Per Tanggal: <span class="date">--</span></p>
        </div>
        <p class="balance__value">Rp 0</p>
      </div>

      <!-- MOVEMENTS LIST -->
      <div class="movements"></div>

      <!-- SUMMARY -->
      <div class="summary">
        <p>
          Masuk:
          <span
            class="summary__value--in"
            style="color: #16a34a; font-weight: bold"
            >Rp 0</span
          >
        </p>
        <p>
          Keluar:
          <span
            class="summary__value--out"
            style="color: #dc2626; font-weight: bold"
            >Rp 0</span
          >
        </p>
        <button class="btn-sort">&downarrow; URUTKAN</button>
      </div>

      <!-- OPERATIONS -->
      <div class="operations">
        <div class="operation-card">
          <h3>Catat Biaya Operasional / Tarik Dana</h3>
          <form class="form form--expense">
            <input
              type="number"
              class="form__input form__input--amount"
              placeholder="Nominal Pengeluaran"
            />
            <button class="form__btn form__btn--expense">&rarr;</button>
          </form>
        </div>
      </div>

      <div class="timer-box">
        Sesi Anda akan berakhir dalam <span class="timer">02:00</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
